[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unitroot-tools"
version = "0.1.0rc1"
description = "Transparent common-sample lag selection for teaching unit-root methods"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "arch==8.0.0",
    "numpy>=1.26.4,<3",
    "scipy>=1.11.4,<2",
    "statsmodels>=0.14.4,<0.16",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["unitroot_tools"]

[tool.coverage.report]
show_missing = true

# Teaching references are installed beside the distribution, not runtime code.
[tool.setuptools.data-files]
"share/doc/unitroot-tools" = ["README.md"]
"share/doc/unitroot-tools/docs" = ["docs/*.md"]
"share/doc/unitroot-tools/docs/archive" = ["docs/archive/*.md"]
"share/doc/unitroot-tools/validation/experiment_a/pilot-summary" = ["validation/experiment_a/pilot-summary/*.gz", "validation/experiment_a/pilot-summary/*.json", "validation/experiment_a/pilot-summary/README.md"]
"share/doc/unitroot-tools/validation/evidence" = ["validation/evidence/*.zip", "validation/evidence/README.md"]
"share/doc/unitroot-tools/examples" = [
    "examples/adf_dfgls.py",
    "examples/pp_kpss.py",
    "examples/teaching_walkthrough.py",
]

"share/doc/unitroot-tools/validation" = [
    "validation/README.md", "validation/*.py", "validation/*.R",
    "validation/*.csv", "validation/*.json", "validation/*.xml",
    "validation/Platform_Validation.ipynb",
]
"share/doc/unitroot-tools/validation/results" = ["validation/results/*.csv", "validation/results/*.json"]
"share/doc/unitroot-tools/validation/enders" = ["validation/enders/*.py", "validation/enders/*.csv", "validation/enders/*.json"]
"share/doc/unitroot-tools/validation/scaled_svd" = ["validation/scaled_svd/*.py", "validation/scaled_svd/*.json"]
"share/doc/unitroot-tools/research" = ["research/__init__.py"]
"share/doc/unitroot-tools/research/experiment_a" = ["research/experiment_a/*.py", "research/experiment_a/*.md"]
"share/doc/unitroot-tools/research/experiment_a/tests" = ["research/experiment_a/tests/*.py"]

# Source snapshots keep the research protocol's relative code links usable.
"share/doc/unitroot-tools/src/unitroot_tools" = ["src/unitroot_tools/*.py"]
